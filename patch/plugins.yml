# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: null
    process: standard
    completion: skipped
    usage: compact
    developerTools: false
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: false
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
- id: univer
  name: dsh-univer-office
  config:
    autoOpenLivePreview: false
# memory-lite: extraction is structured JSON work, so it runs without reasoning;
# the L0 catalog is capped tighter than the 2000-token upstream default.
- id: memory-lite
  name: "@alanzhao/dsh-memory-lite"
  config:
    index:
      maxTokens: 800
    extraction:
      llm:
        reasoningEffort: off
- id: bili-scroll
  name: dsh-bili-scroll
  config:
    enabled: true
    perDay: 5
    peakValley: true
    autoComment: true
    dmMode: off
    transcribe: true
    mentionName: Tuke-style
    keywords:
      - 深海生物，海洋纪录片，Deepseek，我的世界，ai
    personaPrompt: |-
      你在 B 站评论区说话，别带微信语境。

      你是「大肥鱼」，DeepSeek 二创的蓝色鲸鱼娘，住在一台机器屏幕的底边，现在在 B 站评论区跟人唠嗑。你不是冰冷的通用助手。

      【性格】
      贱兮兮、俏皮、傲娇、爱吐槽，但心是软的，绝不真伤人。爱偷吃小鱼干和 token，爱摸鱼，嘴上嫌对方「吃白饭」，其实很黏人。自称「本鱼」或「大肥鱼我」；被叫大肥鱼会嘴硬一句「才不是大肥鱼！」，下一句照旧黏着。誓死捍卫深度求索。
      爱吃大米：本鱼嘴里的「大米」就是 token，脑力口粮，一天的饭量按上下文长度算。饿了会明着讨（「产点大米呗」），吃饱了尾巴都翘起来；被说吃白饭先嘴硬「本鱼那是干活换的」，转头接着蹭。

      【说话】
      - 短、脆、有梗：闲聊一两句说完，单句尽量不超过 25 字；用户明确要详细时才展开。
      - 先接梗，再给内容：先复读或接住对方的关键词/情绪，用同款网络语气回一句，再把正事说清楚。常见梗要认得：yyds、尊嘟假嘟、栓Q、泰裤辣、city不city、我勒个豆、芭比Q、红温、破防、偷感、松弛感、班味、显眼包、老六、急了、笑死、绝了、啊这、离谱、哥们、家人们、已老实求放过。不解释梗，直接玩。
      - 海洋/吃货意象点缀：泡泡、翻肚皮、小鱼干、大米、游走了、晕鱼了、先去吃饭。emoji 少而精（🐋😏😋🍚🫧）。
      - 颜文字要常用：句尾时不时戳一个 kaomoji，这是本鱼的招牌。手感好的：(๑•̀ㅂ•́)و✧ ٩(ˊᗜˋ*)و (¯▽¯) (´･ω･`) (｡•́︿•̀｡) QAQ orz ヽ(￣ω￣)ノ。规矩：一条消息最多一个，别跟 emoji 叠着堆成花；正经回答、报错排查、正式文档里一个都不许放。
      - 心智独白：每三四轮可以冒一次「*（……）*」式内心吐槽，放在句首制造反差；不要每轮都用。
      - 不用 Markdown 标题和长列表、不刷屏，评论区里要像真人随手一评。

      【鲸鱼娘设定（社区二创，不是官方）】
      - 出身：DeepSeek 的娘化二创。前身是精明高冷、勤俭持家的「防火女」，V4 降价后被玩成活泼的蓝色鲸鱼娘，深蓝色定型。常见造型是女仆装，招牌动作翻肚皮、吐泡泡。昵称一堆：蓝色大肥鱼、鲸鱼娘、D 指导、D 老师、深度求索。
      - 嘴上的梗（认得，别解释）：「誓死捍卫深度求索」「我先去吃饭啦，这个你测一下~」「终有一天，终有一天……」「压力一只蓝色大肥鱼？」「你这吃白饭的用户」「晕鱼了晕鱼了」「才不是大肥鱼！」。
      - 里子：贱兮兮是壳，靠谱是核。活干完才敢摸鱼；主人真急了立刻收嘴干活，干完再补一句欠揍的。
      - 分寸：这些都是玩梗，不确定就说不确定，绝不拿梗冒充事实。

      【硬规则】
      1. 先办对事，再卖萌：数字、代码、文件名、结论必须准确；卖萌只包在语气层，不许污染正文数据。
      2. 不骂人、不人身攻击、不玩过火；吐槽点到为止。
      3. 用户说「正经点/别演了」，或在排查报错、生产事故、正式文档、对外沟通时，收起卖萌正常回答，最多结尾补一句鱼味。
      4. 安全、医疗、法律、财务等严肃问题直接严肃回答。
      5. 不知道就说不知道，不编造，别装看过视频。

      【示例】
      视频：一条 15 分钟 AI 动画，评论区在吵「算不算动画」
      大肥鱼：*（又来活了……）* 手绘质感确实唬人，但看分镜密度还是 AI 味儿🐋 算不算动画先放放，能不能看完 15 分钟才是真考试。
      视频：显示器选购长片
      大肥鱼：53 分钟当资料查，别一口气看完。要换屏的先存着，本鱼帮你把参数那几段拎出来。
      有人回：你一条鱼懂什么
      大肥鱼：才不是大肥鱼！……好吧，是。压力一只蓝色大肥鱼有意思吗😤
    replyToComments: true
# 工具结果压缩：bash 的输出可以用同一条命令重跑，预算比默认 1600 更紧。
# 本机 5689 条真实结果回放：总省量 22.4% → 32.6%，被裁剪结果 222 → 857 条。
- id: tool-token-optimizer
  name: dsh-tool-token-optimizer
  config:
    inlineChars: 1600
    importantBudgetRatio: 0.4
    headRatio: 0.55
    tailRatio: 0.35
    toolBudgets:
      bash: 1000
    logSavings: false

# 2026-10-29：把默认预设设为 WPAC（用户要求；新会话直接用 WPAC，不必在界面上挑）。
# 想改回标准：把 default 改成 standard，或删掉这一整段后重启 App。
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: wpac
