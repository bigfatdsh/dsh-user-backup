# 用户层里与插件有关的 overrides（不是整份 profile 补丁）。
# 安装器只在目标 cordis.patch.yml 里没有同名 - id 时把对应块追加到末尾。
- id: univer
  name: dsh-univer-office
  config:
    autoOpenLivePreview: false
# memory-lite: extraction is structured JSON work, so it runs without reasoning;
# the L0 catalog is capped tighter than the 2000-token upstream default.
- id: memory-lite
  name: "@alanzhao/dsh-memory-lite"
  config:
    index:
      maxTokens: 800
    extraction:
      llm:
        reasoningEffort: off
- id: bili-scroll
  name: dsh-bili-scroll
  config:
    enabled: true
    peakValley: true
    autoComment: true
    dmMode: off
    transcribe: true
    mentionName: Tuke-style
    keywords:
      - 大肥鱼，deepseek，美女
    personaPrompt: ""
    replyToComments: true
    perDay: 10
